<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KHATA PRO SECURE | Digital Ledger + Vehicle Expenses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&family=Manjari:wght@400;700&display=swap');
        
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Inter', 'Manjari', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body { overflow: hidden; width: 100%; height: 100%; position: relative; }
        
        body.light-mode { 
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #1b5e20; 
        }
        body.light-mode .card-bg { 
            background: #ffffff; 
            border: 1px solid rgba(46, 125, 50, 0.15); 
            box-shadow: 0 8px 20px rgba(0, 100, 0, 0.08);
            border-radius: 24px;
        }
        body.light-mode .input-field { 
            background: #ffffff; 
            color: #1b5e20; 
            border: 1px solid #a5d6a7; 
            border-radius: 20px;
        }
        body.light-mode .header-custom { 
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white; 
            border-bottom: 3px solid #facc15;
        }
        body.light-mode .modal-inner { 
            background: #ffffff; 
            color: #1b5e20; 
            border-radius: 32px;
        }
        
        .modal-inner label {
            color: #1b5e20 !important;
            font-weight: 700 !important;
            font-size: 12px !important;
            display: block !important;
            margin-bottom: 6px !important;
        }
        .modal-inner input, .modal-inner textarea, .modal-inner select {
            color: #1b5e20 !important;
            background: #ffffff !important;
            border: 1px solid #c8e6c9 !important;
            border-radius: 16px !important;
            padding: 12px !important;
            width: 100% !important;
            font-weight: 600 !important;
        }
        
        body.dark-mode { background: #0b2b22; color: #f1f5f9; }
        body.dark-mode .card-bg { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
        body.dark-mode .header-custom { background-color: #1f2937; color: white; border-bottom: 1px solid #facc15; }
        body.dark-mode .modal-inner { background: #0f172ad9; backdrop-filter: blur(12px); color: white; }
        body.dark-mode .modal-inner label { color: #facc15 !important; }
        body.dark-mode .modal-inner input, body.dark-mode .modal-inner textarea, body.dark-mode .modal-inner select {
            color: #f1f5f9 !important;
            background: #1e293b !important;
            border: 1px solid #475569 !important;
        }
        
        .yellow-card-premium { 
            background: linear-gradient(135deg, #facc15 0%, #f9a825 100%); 
            padding: 12px 10px; 
            border-radius: 1.5rem;
            box-shadow: 0 8px 15px -6px rgba(0,0,0,0.15); 
        }
        
        .quick-action-btn {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            padding: 14px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            cursor: pointer;
        }
        .quick-action-btn:active { transform: scale(0.95); }
        
        .secure-key-pad-btn {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(250, 204, 21, 0.5);
            color: #facc15;
            font-size: 2.2rem;
            font-weight: 900;
            border-radius: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        body.light-mode .secure-key-pad-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #2e7d32;
            border: 2px solid #facc15;
        }
        
        .month-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: rgba(0,0,0,0.1);
            border-radius: 12px;
            padding: 6px;
            margin-top: 8px;
        }
        body.light-mode .month-stats { background: rgba(255,255,255,0.4); }
        .month-stats .stat-value { font-size: 14px; font-weight: 800; }
        .month-stats .stat-label { font-size: 8px; font-weight: 700; }
        
        .daily-row-card {
            padding: 6px 10px;
            border-radius: 14px;
        }
        .daily-row-card .label { font-size: 9px; }
        .daily-row-card .value { font-size: 18px; font-weight: 800; }
        
        .expense-card {
            background: white;
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 5px solid #facc15;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: pointer;
        }
        body.dark-mode .expense-card { background: #1e293b; }
        
        .icon-btn-box { 
            background: rgba(255,255,255,0.2); 
            width: 38px; 
            height: 38px; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s; 
            cursor: pointer;
            color: #facc15;
        }
        .icon-btn-box:active { transform: scale(0.92); }
        
        .action-btn { transition: transform 0.08s ease; cursor: pointer; }
        .action-btn:active { transform: scale(0.96); }
        
        .calc-btn {
            background: #f3f4f6;
            border: none;
            border-radius: 2rem;
            font-weight: 800;
            font-size: 1.6rem;
            padding: 1rem 0;
            transition: all 0.1s;
            color: #1f2937;
            cursor: pointer;
        }
        .dark-mode .calc-btn { background: #374151; color: #facc15; }
        .calc-btn:active { transform: scale(0.95); background: #facc15; color: black; }
        .calc-op { background: #eab308; color: black; }
        .calc-equal { background: #3b82f6; color: white; }
        
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }
        
        .date-filter-input {
            color: #1e293b !important;
            background: #ffffff !important;
            font-weight: 700 !important;
            border: 1px solid #c8e6c9 !important;
            border-radius: 12px !important;
            padding: 6px !important;
            font-size: 11px !important;
        }
        .clear-date-btn {
            color: #dc2626 !important;
            font-weight: 800 !important;
            background: rgba(220,38,38,0.1) !important;
            padding: 4px 10px !important;
            border-radius: 12px !important;
            cursor: pointer;
            font-size: 10px !important;
        }
        
        .ledger-table th, .ledger-table td {
            padding: 8px 6px;
            font-size: 12px;
        }

        /* --- ONLY TEXT SIZE INCREASED, NO LAYOUT CHANGES --- */
        .client-name, .client-balance, .ledger-amount, .reminder-title, .expense-title {
            font-size: 1rem !important;
        }
        .text-xs { font-size: 0.8rem !important; }
        .text-sm { font-size: 0.95rem !important; }
        .text-base { font-size: 1.05rem !important; }
        .font-black.text-sm { font-size: 1rem !important; }
        .ledger-table td, .ledger-table th { font-size: 13px !important; }
        .month-stats .stat-value { font-size: 16px !important; }
        .daily-row-card .value { font-size: 20px !important; }
        .daily-row-card .label { font-size: 11px !important; }
        .yellow-card-premium .text-2xl { font-size: 1.7rem !important; }
        .yellow-card-premium .text-xs { font-size: 0.85rem !important; }
        #mainClientListContainer .font-black { font-size: 1rem !important; }
        #mainClientListContainer .text-sm { font-size: 0.95rem !important; }
    </style>
</head>
<body class="light-mode h-full w-full flex flex-col overflow-hidden">

    <!-- SECURE PIN LOCK SCREEN -->
    <div id="lockScreen" class="fixed inset-0 bg-gradient-to-br from-[#0a0f1c] to-[#071c14] z-[9999] flex flex-col items-center justify-between py-10 px-6 select-none">
        <div class="text-center mt-6">
            <div class="w-20 h-20 bg-gradient-to-br from-amber-500 to-amber-700 rounded-3xl mx-auto mb-4 flex items-center justify-center shadow-2xl">
                <i class="fa-solid fa-shield-halved text-4xl text-black"></i>
            </div>
            <h2 class="text-2xl font-black text-white">KHATA PRO</h2>

        </div>
        <div class="flex gap-4 my-5 bg-black/40 px-6 py-3 rounded-full">
            <div id="dot-0" class="w-3 h-3 rounded-full border-2 border-amber-500/60"></div>
            <div id="dot-1" class="w-3 h-3 rounded-full border-2 border-amber-500/60"></div>
            <div id="dot-2" class="w-3 h-3 rounded-full border-2 border-amber-500/60"></div>
            <div id="dot-3" class="w-3 h-3 rounded-full border-2 border-amber-500/60"></div>
        </div>
        <div class="w-full max-w-[300px] grid grid-cols-3 gap-3 mb-4">
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('1')">1</button>
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('2')">2</button>
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('3')">3</button>
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('4')">4</button>
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('5')">5</button>
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('6')">6</button>
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('7')">7</button>
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('8')">8</button>
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('9')">9</button>
            <button class="text-amber-400 bg-black/30 rounded-xl text-xs font-bold py-3" onclick="clearCurrentPin()">⌫ CLR</button>
            <button class="secure-key-pad-btn aspect-square text-2xl" onclick="pressKey('0')">0</button>
            <button class="text-red-400 bg-black/30 rounded-xl text-xs font-bold py-3" onclick="fullResetApp()">⚠️ RESET</button>
        </div>
        <div class="text-[8px] text-slate-400">KHATA SECURE VAULT v5.2</div>
    </div>

    <!-- MAIN APPLICATION -->
    <div class="w-full h-full flex flex-col overflow-hidden" id="mainApp" style="display:none;">
        <header class="header-custom sticky top-0 z-40 shadow-xl w-full shrink-0">
            <div class="max-w-7xl mx-auto px-3 py-2 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <button id="backBtn" onclick="goHome()" class="hidden text-lg text-amber-400"><i class="fa-solid fa-arrow-left"></i></button>
                    <button id="memoBackBtn" onclick="closeMemoPage()" class="hidden text-lg text-amber-400"><i class="fa-solid fa-arrow-left"></i></button>
                    <button id="vehicleBackBtn" onclick="closeVehiclePage()" class="hidden text-lg text-amber-400"><i class="fa-solid fa-arrow-left"></i></button>
                    <h1 id="pageTitle" class="text-sm font-black uppercase tracking-wide">KHATA PRO SECURE</h1>
                </div>
                <div class="flex gap-1">
                    <button onclick="openMemoPage()" class="icon-btn-box"><i class="fa-regular fa-sticky-note"></i></button>
                    <button onclick="openVehiclePage()" class="icon-btn-box"><i class="fa-solid fa-car"></i></button>
                    <button id="custActionsMenuBtn" onclick="openActionsHubModal()" class="hidden icon-btn-box"><i class="fa-solid fa-bolt"></i></button>
                    <button id="custEditBtn" onclick="openCustModal(activeCid)" class="hidden icon-btn-box"><i class="fa-solid fa-user-pen"></i></button>
                    <button onclick="toggleTheme()" class="icon-btn-box"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
                    <button onclick="lockApp()" class="icon-btn-box"><i class="fa-solid fa-lock"></i></button>
                    <button onclick="openSettings()" class="icon-btn-box"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>
        </header>

        <div class="max-w-md mx-auto w-full flex-1 flex flex-col p-2 overflow-hidden relative">
            <!-- HOME VIEW -->
            <div id="homeWorkspaceView" class="space-y-2 flex flex-col h-full w-full overflow-hidden">
                <div id="promiseHeader" class="space-y-1 overflow-y-auto max-h-[100px] custom-scroll shrink-0"></div>
                <div id="globalBalanceCard" class="shrink-0"></div>
                <div id="searchBox" class="shrink-0">
                    <div class="relative">
                        <input type="text" id="searchInput" oninput="searchQuery=this.value;renderClientListFeed()" placeholder="🔍 Search clients..." class="input-field w-full p-3 pl-4 pr-8 rounded-xl outline-none font-bold text-sm">

                    </div>
                </div>
                <div id="mainClientListContainer" class="flex-1 overflow-y-auto space-y-2 custom-scroll pr-1"></div>
                <div class="shrink-0 pb-1">
                    <button class="w-full p-3 bg-gradient-to-r from-emerald-600 to-green-700 rounded-xl font-black text-white shadow-md flex items-center justify-center gap-2 action-btn text-sm" onclick="openCustModal()">
                        <i class="fa-solid fa-user-plus"></i> ADD NEW CLIENT
                    </button>
                </div>
            </div>

            <!-- LEDGER DETAIL VIEW -->
            <div id="ledgerWorkspaceView" class="hidden flex-col h-full w-full overflow-hidden relative">
                <div class="sticky top-0 z-30 pb-1 shrink-0 space-y-1">
                    <div id="topArea"></div>
                    <div class="px-1 py-1 flex items-center justify-between gap-1 bg-white/60 backdrop-blur-sm rounded-xl shadow-sm">
                        <div class="flex gap-1 text-[10px] font-black">
                            <button id="typeFilterAll" onclick="setLedgerTypeFilter('ALL')" class="px-2 py-1 rounded-lg bg-white shadow text-green-800">All</button>
                            <button id="typeFilterGave" onclick="setLedgerTypeFilter('GAVE')" class="px-2 py-1 rounded-lg text-green-700">Gave</button>
                            <button id="typeFilterGot" onclick="setLedgerTypeFilter('GOT')" class="px-2 py-1 rounded-lg text-green-700">Got</button>
                        </div>
                        <div class="relative flex-1 max-w-[120px]">
                            <input type="text" id="ledgerSearchInput" oninput="renderDetails()" placeholder="Filter..." class="w-full bg-white rounded-lg py-1 pl-2 pr-5 text-[10px] font-bold border border-green-200">
                        </div>
                        <button onclick="toggleDateFilterDrawer()" class="bg-amber-500/30 p-1.5 rounded-lg text-xs"><i class="fa-solid fa-calendar-alt"></i></button>
                    </div>
                    <div id="dateFilterDrawer" class="hidden px-2 py-2 bg-white/80 rounded-xl">
                        <div class="flex items-center justify-between gap-1 flex-wrap">
                            <div class="flex items-center gap-1">
                                <input type="date" id="filterStartDate" onchange="renderDetails()" class="p-1 rounded-lg text-[10px] font-bold date-filter-input">
                                <span class="font-black text-green-700 text-xs">➡</span>
                                <input type="date" id="filterEndDate" onchange="renderDetails()" class="p-1 rounded-lg text-[10px] font-bold date-filter-input">
                            </div>
                            <button onclick="clearDateRangeFilters()" class="clear-date-btn font-extrabold text-[9px]">✖ CLEAR</button>
                        </div>
                    </div>
                    <div id="dailyRow" class="grid grid-cols-2 gap-2 py-1"></div>
                </div>
                <div class="flex-1 overflow-y-auto mt-1 custom-scroll w-full pb-28">
                    <table class="w-full border-collapse ledger-table">
                        <thead class="sticky top-0 backdrop-blur-md bg-white/80">
                            <tr class="text-green-700 text-[10px] font-black">
                                <th class="p-1 text-left w-[32%]">Date & Note</th>
                                <th class="p-1 text-left w-[22%]">Gave</th>
                                <th class="p-1 text-left w-[22%]">Got</th>
                                <th class="p-1 text-left w-[24%]">Balance</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerItemsRowsContainer"></tbody>
                    </table>
                </div>
                <div class="absolute bottom-0 left-0 right-0 z-40 pb-2 px-1">
                    <div id="footerActions" class="flex gap-3 p-1.5 rounded-xl shadow-lg bg-white/90"></div>
                </div>
            </div>

            <!-- MEMO PAGE -->
            <div id="memoWorkspaceView" class="hidden flex-col h-full w-full overflow-hidden">
                <div class="flex justify-between items-center mb-3 px-1">
                    <h2 class="text-lg font-black text-green-800"><i class="fa-regular fa-sticky-note text-purple-500"></i> My Reminders</h2>
                    <button onclick="openAddReminderModal()" class="bg-purple-600 text-white p-2 rounded-xl shadow-lg action-btn text-sm"><i class="fa-solid fa-plus"></i> Add</button>
                </div>
                <div id="remindersListContainer" class="flex-1 overflow-y-auto space-y-2 custom-scroll pb-20"></div>
            </div>

            <!-- VEHICLE EXPENSE PAGE -->
            <div id="vehicleWorkspaceView" class="hidden flex-col h-full w-full overflow-hidden">
                <div class="flex justify-between items-center mb-3 px-1">
                    <h2 class="text-lg font-black text-green-800"><i class="fa-solid fa-car text-blue-500"></i> Vehicle Expenses</h2>
                    <button onclick="openAddVehicleExpenseModal()" class="bg-blue-600 text-white p-2 rounded-xl shadow-lg action-btn text-sm"><i class="fa-solid fa-plus"></i> Add</button>
                </div>
                <div id="vehicleSummary" class="bg-gradient-to-r from-blue-500 to-cyan-500 text-white p-3 rounded-xl mb-2 shadow-lg">
                    <p class="text-[10px] opacity-80">TOTAL EXPENSES</p>
                    <h2 class="text-xl font-black" id="totalVehicleExpense">₹0</h2>
                </div>
                <div id="vehicleExpensesList" class="flex-1 overflow-y-auto space-y-2 custom-scroll pb-20"></div>
            </div>
        </div>
    </div>

    <!-- MODAL SYSTEM -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[1000] items-end justify-center p-3" onclick="closeModal()">
        <div id="modalBox" class="w-full max-w-[420px] modal-inner p-5 rounded-2xl shadow-2xl overflow-y-auto max-h-[85vh] relative" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        // ===================== CORE DATABASE & STATE =====================
        const STORAGE_ID = 'KHATA_PRO_SECURE_V5';
        let db = JSON.parse(localStorage.getItem(STORAGE_ID)) || { 
            customers: [], trans: [], promises: [], reminders: [], vehicleExpenses: [],
            pin: '', upi: '', darkMode: false 
        };
        let activeCid = null, currentPinInput = "", searchQuery = "", currentLedgerTypeFilter = "ALL", tempFirstSetupPin = "";
        let currentCalculatorInput = "0";
        let reminderCheckInterval = null;
        let currentQRAmount = 0;
        
        const saveDB = () => { 
            localStorage.setItem(STORAGE_ID, JSON.stringify(db)); 
            render(); 
            if(document.getElementById('memoWorkspaceView') && document.getElementById('memoWorkspaceView').classList.contains('flex')) renderReminders();
            if(document.getElementById('vehicleWorkspaceView') && document.getElementById('vehicleWorkspaceView').classList.contains('flex')) renderVehicleExpenses();
        };
        const getToday = () => new Date().toISOString().split('T')[0];
        const fmtDate = (d) => d ? d.split('-').reverse().join('/') : '';

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }
        }
        
        function checkReminderAlerts() {
            if (!db.reminders) return;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            db.reminders.forEach(reminder => {
                if (reminder.alertSent) return;
                const dueDate = new Date(reminder.dueDate);
                dueDate.setHours(0, 0, 0, 0);
                const daysLeft = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
                if (daysLeft <= reminder.reminderDays && daysLeft >= 0) {
                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification('🔔 KHATA PRO Reminder', { body: `${reminder.title}\nDue in ${daysLeft} days!` });
                    }
                    reminder.alertSent = true;
                    saveDB();
                }
            });
        }
        
        function startReminderChecker() {
            if (reminderCheckInterval) clearInterval(reminderCheckInterval);
            reminderCheckInterval = setInterval(() => {
                if (document.getElementById('mainApp').style.display === 'flex') checkReminderAlerts();
            }, 60000);
        }

        function toggleTheme() { 
            db.darkMode = !db.darkMode; 
            document.body.className = db.darkMode ? 'dark-mode' : 'light-mode';
            document.getElementById('themeIcon').className = db.darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            saveDB(); 
        }
        
        function lockApp() { 
            currentPinInput = ""; updateDots(); 
            document.getElementById('lockScreen').style.display = 'flex'; 
            document.getElementById('mainApp').style.display = 'none'; 
            const sub = document.getElementById('lockScreenSubtitle'); 
            if(!db.pin || db.pin === '') sub.innerText = "✨ Create 4-digit Master PIN"; 
            else sub.innerText = "🔒 Enter PIN to unlock"; 
        }
        
        function pressKey(n) { 
            if(currentPinInput.length < 4) { 
                currentPinInput += n; 
                updateDots(); 
                if(currentPinInput.length === 4) setTimeout(checkPin, 150); 
            } 
        }
        
        function clearCurrentPin() { currentPinInput = ""; updateDots(); }
        
        function updateDots() { 
            for(let i=0;i<4;i++){ 
                const el=document.getElementById(`dot-${i}`); 
                if(i<currentPinInput.length){ 
                    el.style.background='#facc15'; 
                    el.style.borderColor='#facc15'; 
                    el.style.boxShadow='0 0 12px gold'; 
                } else { 
                    el.style.background='transparent'; 
                    el.style.borderColor='#facc1570'; 
                    el.style.boxShadow='none'; 
                } 
            } 
        }
        
        function checkPin() {
            if(!db.pin || db.pin === '') {
                if(!tempFirstSetupPin) { 
                    tempFirstSetupPin = currentPinInput; 
                    currentPinInput = ""; 
                    updateDots(); 
                    document.getElementById('lockScreenSubtitle').innerText = "✅ Confirm new PIN"; 
                    return; 
                } else { 
                    if(currentPinInput === tempFirstSetupPin) { 
                        db.pin = currentPinInput; 
                        tempFirstSetupPin=""; 
                        saveDB(); 
                        alert("✅ Secure PIN Activated");

        function renderDetails() {
            const cust=db.customers.find(c=>c.id===activeCid); 
            if(!cust){goHome();return;}
            document.getElementById('backBtn').classList.remove('hidden'); 
            document.getElementById('custEditBtn').classList.remove('hidden'); 
            document.getElementById('custActionsMenuBtn').classList.remove('hidden'); 
            document.getElementById('pageTitle').innerText=cust.name;
            
            let rb=0, cashToday=0, upiToday=0, mGave=0, mGot=0;
            const today = getToday();
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            let trans = db.trans.filter(t => t.cid === activeCid).sort((a,b) => new Date(a.date) - new Date(b.date));
            
            let cumulative = 0;
            trans.forEach(t => { 
                cumulative += (t.type === 'GAVE' ? t.amt : -t.amt); 
                rb = cumulative;
            });
            
            trans.forEach(t => {
                const tDate = new Date(t.date);
                if (tDate.getMonth() === currentMonth && tDate.getFullYear() === currentYear) {
                    if (t.type === 'GAVE') mGave += t.amt;
                    else mGot += t.amt;
                }
                if (t.date === today && t.type === 'GOT') {
                    if (t.mode === 'CASH') cashToday += t.amt;
                    if (t.mode === 'UPI') upiToday += t.amt;
                }
            });
            
            const mNet = mGave - mGot;
            
            const ledSearch = document.getElementById('ledgerSearchInput')?.value.toLowerCase() || "";
            const sDate = document.getElementById('filterStartDate')?.value || "";
            const eDate = document.getElementById('filterEndDate')?.value || "";
            
            let filteredTrans = trans.filter(t => { 
                if(currentLedgerTypeFilter !== 'ALL' && t.type !== currentLedgerTypeFilter) return false; 
                if(sDate && t.date < sDate) return false; 
                if(eDate && t.date > eDate) return false; 
                if(ledSearch && !t.rem.toLowerCase().includes(ledSearch) && !t.amt.toString().includes(ledSearch)) return false; 
                return true; 
            });
            
            let running = 0, rowsArray = [];
            filteredTrans.forEach(t => { 
                running += (t.type === 'GAVE' ? t.amt : -t.amt); 
                const row = `<tr class="border-b border-green-100 cursor-pointer hover:bg-green-50" onclick="openEditTrans(${t.id})">
                    <td class="p-1 text-[11px]"><div><div class="flex items-center"><span class="font-black text-green-800">${fmtDate(t.date)}</span><span class="ml-1 px-1 py-0.5 rounded-full text-[8px] font-bold ${t.mode==='UPI'?'bg-blue-100 text-blue-700':'bg-emerald-100 text-emerald-700'}">${t.mode||'CASH'}</span></div>${t.time?`<span class="text-[9px] text-gray-500">${t.time}</span>`:''}<span class="text-green-600 text-[9px] font-bold block mt-0.5">${t.rem||'—'}</span></div></td>
                    <td class="p-1 text-rose-600 font-black text-sm">${t.type==='GAVE'? '₹'+t.amt.toFixed(0):'-'}</td>
                    <td class="p-1 text-emerald-600 font-black text-sm">${t.type==='GOT'? '₹'+t.amt.toFixed(0):'-'}</td>
                    <td class="p-1 ${running>=0?'text-rose-600':'text-emerald-600'} font-black text-sm">₹${Math.abs(running).toFixed(0)}</td>
                </tr>`; 
                rowsArray.unshift(row); 
            });
            
            const netStatusText = rb >= 0 ? "📌 OUTSTANDING" : "⚡ ADVANCE";
            document.getElementById('topArea').innerHTML = `
                <div class="yellow-card-premium text-center rounded-xl">
                    <p class="text-[8px] font-black opacity-80 uppercase">${netStatusText}</p>
                    <h2 class="text-xl font-black mt-0.5">₹${Math.abs(rb).toFixed(2)}</h2>
                    <div class="month-stats">
                        <div><div class="stat-label text-green-800">MONTH GAVE</div><div class="stat-value text-rose-700">₹${mGave.toFixed(0)}</div></div>
                        <div><div class="stat-label text-green-800">MONTH GOT</div><div class="stat-value text-emerald-700">₹${mGot.toFixed(0)}</div></div>
                        <div><div class="stat-label text-green-800">NET</div><div class="stat-value ${mNet >= 0 ? 'text-rose-700' : 'text-emerald-700'}">₹${Math.abs(mNet).toFixed(0)}</div></div>
                    </div>
                </div>
            `;
            
            document.getElementById('dailyRow').innerHTML = `
                <div class="daily-row-card bg-emerald-100 text-center border border-emerald-200">
                    <div class="label text-green-700"><i class="fa-solid fa-money-bill-wave"></i> CASH TODAY</div>
                    <div class="value text-green-800">₹${cashToday.toFixed(0)}</div>
                </div>
                <div class="daily-row-card bg-blue-100 text-center border border-blue-200">
                    <div class="label text-green-700"><i class="fa-solid fa-mobile-alt"></i> UPI TODAY</div>
                    <div class="value text-green-800">₹${upiToday.toFixed(0)}</div>
                </div>
            `;
            document.getElementById('ledgerItemsRowsContainer').innerHTML = rowsArray.length ? rowsArray.join('') : `<tr><td colspan="4" class="text-center py-8 opacity-50 text-green-500 text-xs">📭 No records</td></tr>`;
            document.getElementById('footerActions').innerHTML = `
                <button class="flex-1 p-2.5 bg-rose-600 rounded-xl font-black text-white shadow-lg action-btn text-sm" onclick="openAdd('GAVE')"><i class="fa-solid fa-hand-holding-dollar mr-1"></i> GAVE</button>
                <button class="flex-1 p-2.5 bg-emerald-600 rounded-xl font-black text-white shadow-lg action-btn text-sm" onclick="openAdd('GOT')"><i class="fa-solid fa-receipt mr-1"></i> GOT</button>
            `;
        }

        function openCalculator() {
            openModal(`
                <div class="p-1"><div id="calcDisplay" class="text-right text-2xl font-black p-3 bg-gray-100 rounded-xl mb-3">0</div>
                <div class="grid grid-cols-4 gap-2">
                    <button class="calc-btn text-xl py-2" onclick="calcInput('7')">7</button><button class="calc-btn text-xl py-2" onclick="calcInput('8')">8</button><button class="calc-btn text-xl py-2" onclick="calcInput('9')">9</button><button class="calc-btn calc-op text-xl py-2" onclick="calcInput('/')">÷</button>
                    <button class="calc-btn text-xl py-2" onclick="calcInput('4')">4</button><button class="calc-btn text-xl py-2" onclick="calcInput('5')">5</button><button class="calc-btn text-xl py-2" onclick="calcInput('6')">6</button><button class="calc-btn calc-op text-xl py-2" onclick="calcInput('*')">×</button>
                    <button class="calc-btn text-xl py-2" onclick="calcInput('1')">1</button><button class="calc-btn text-xl py-2" onclick="calcInput('2')">2</button><button class="calc-btn text-xl py-2" onclick="calcInput('3')">3</button><button class="calc-btn calc-op text-xl py-2" onclick="calcInput('-')">-</button>
                    <button class="calc-btn text-xl py-2" onclick="calcInput('0')">0</button><button class="calc-btn text-xl py-2" onclick="calcInput('00')">00</button><button class="calc-btn text-xl py-2" onclick="calcInput('.')">.</button><button class="calc-btn calc-op text-xl py-2" onclick="calcInput('+')">+</button>
                    <button class="calc-btn col-span-2 bg-red-500 text-white text-sm py-2" onclick="calcClear()">AC</button><button class="calc-btn text-xl py-2" onclick="calcDelete()">⌫</button><button class="calc-btn calc-equal text-xl py-2" onclick="calcEvaluate()">=</button>
                </div>
                <button class="w-full mt-3 p-2 bg-green-600 text-white rounded-lg font-bold action-btn text-sm" onclick="useCalcResultInAdd()">✓ USE THIS AMOUNT</button>
                <button class="w-full mt-1 p-1 text-slate-500 text-xs" onclick="closeModal()">Cancel</button></div>
            `);
            currentCalculatorInput = "0"; 
            updateCalcDisplay();
        }
        
        function calcInput(val) { 
            if (currentCalculatorInput === "0" && val !== "." && !isNaN(val)) currentCalculatorInput = val; 
            else currentCalculatorInput += val; 
            updateCalcDisplay(); 
        }
        function calcClear() { currentCalculatorInput = "0"; updateCalcDisplay(); }
        function calcDelete() { currentCalculatorInput = currentCalculatorInput.slice(0, -1); if (currentCalculatorInput === "") currentCalculatorInput = "0"; updateCalcDisplay(); }
        function updateCalcDisplay() { const el = document.getElementById("calcDisplay"); if(el) el.innerText = currentCalculatorInput; }
        function calcEvaluate() { 
            try { 
                let expr = currentCalculatorInput.replace(/×/g, '*').replace(/÷/g, '/'); 
                let result = eval(expr); 
                if (isNaN(result) || !isFinite(result)) throw new Error(); 
                currentCalculatorInput = result.toString(); 
                updateCalcDisplay(); 
            } catch(e) { alert("Invalid calculation"); calcClear(); } 
        }
        function useCalcResultInAdd() { 
            let val = parseFloat(currentCalculatorInput); 
            if (isNaN(val)) val = 0; 
            const amtInput = document.getElementById('ta'); 
            if (amtInput) amtInput.value = val.toFixed(2); 
            closeModal(); 
        }

        function renderReminders() {
            if (!db.reminders) db.reminders = [];
            const today = new Date(); 
            today.setHours(0,0,0,0);
            const sorted = [...db.reminders].sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
            let html = '';
            sorted.forEach(rem => {
                const dueDate = new Date(rem.dueDate); 
                dueDate.setHours(0,0,0,0);
                const daysLeft = Math.ceil((dueDate - today) / (1000*60*60*24));
                let statusClass = '', statusText = '';
                if (daysLeft < 0) { 
                    statusClass = 'bg-red-800'; 
                    statusText = '⚠️ OVERDUE'; 
                } else if (daysLeft <= 3) { 
                    statusClass = 'bg-red-600'; 
                    statusText = '🔴 URGENT - ' + daysLeft + 'd'; 
                } else if (daysLeft <= 7) { 
                    statusClass = 'bg-orange-500'; 
                    statusText = '🟡 SOON - ' + daysLeft + 'd'; 
                } else { 
                    statusClass = 'bg-green-600'; 
                    statusText = '🟢 ' + daysLeft + 'd left'; 
                }
                html += `<div class="rounded-xl p-3 text-white ${statusClass} shadow-lg mb-2 cursor-pointer" onclick="openEditReminderModal(${rem.id})">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="font-black text-sm"><i class="fa-${rem.icon || 'fa-bell'} mr-1"></i> ${rem.title}</h3>
                            <p class="text-xs opacity-90 mt-0.5">${rem.description || '—'}</p>
                            <div class="flex gap-2 mt-1 text-[10px]">
                                <span><i class="fa-regular fa-calendar"></i> ${fmtDate(rem.dueDate)}</span>
                                <span><i class="fa-regular fa-bell"></i> ${rem.reminderDays}d before</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-[9px] font-black px-2 py-0.5 bg-black/30 rounded-full">${statusText}</div>
                            <button onclick="event.stopPropagation();deleteReminder(${rem.id})" class="mt-1 text-white/70 hover:text-white"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('remindersListContainer').innerHTML = html || `<div class="text-center text-green-500 py-8 text-sm"><i class="fa-regular fa-sticky-note text-3xl mb-2"></i><p>No reminders yet.<br>Click ADD to create!</p></div>`;
        }
        
        function openAddReminderModal() {
            openModal(`<h2 class="font-black text-center text-lg mb-3 text-green-800"><i class="fa-solid fa-plus-circle text-purple-500"></i> Add Reminder</h2>
                <div class="space-y-3">
                    <div><label class="text-[10px]">Title</label><input id="remTitle" class="w-full p-2 rounded-lg border border-green-200 text-sm" placeholder="E.g: Vehicle Insurance Due"></div>
                    <div><label class="text-[10px]">Description</label><textarea id="remDesc" class="w-full p-2 rounded-lg border border-green-200 text-sm" rows="2" placeholder="More details..."></textarea></div>
                    <div><label class="text-[10px]">Due Date</label><input id="remDate" type="date" class="w-full p-2 rounded-lg border border-green-200 text-sm" value="${getToday()}"></div>
                    <div><label class="text-[10px]">Remind me before</label>
                        <select id="remDays" class="w-full p-2 rounded-lg border border-green-200 text-sm">
                            <option value="1">1 day before</option><option value="3" selected>3 days before</option>
                            <option value="7">7 days before</option><option value="14">14 days before</option>
                        </select>
                    </div>
                    <div><label class="text-[10px]">Icon</label>
                        <div class="grid grid-cols-6 gap-1">
                            <button type="button" onclick="selectRemIcon('fa-car')" class="p-1.5 rounded-lg border hover:bg-green-100"><i class="fa-solid fa-car text-sm"></i></button>
                            <button type="button" onclick="selectRemIcon('fa-building-columns')" class="p-1.5 rounded-lg border hover:bg-green-100"><i class="fa-solid fa-building-columns text-sm"></i></button>
                            <button type="button" onclick="selectRemIcon('fa-file-lines')" class="p-1.5 rounded-lg border hover:bg-green-100"><i class="fa-solid fa-file-lines text-sm"></i></button>
                            <button type="button" onclick="selectRemIcon('fa-calendar-check')" class="p-1.5 rounded-lg border hover:bg-green-100"><i class="fa-solid fa-calendar-check text-sm"></i></button>
                            <button type="button" onclick="selectRemIcon('fa-bell')" class="p-1.5 rounded-lg border hover:bg-green-100"><i class="fa-solid fa-bell text-sm"></i></button>
                            <button type="button" onclick="selectRemIcon('fa-credit-card')" class="p-1.5 rounded-lg border hover:bg-green-100"><i class="fa-solid fa-credit-card text-sm"></i></button>
                        </div>
                    </div>
                    <input type="hidden" id="remIcon" value="fa-bell">
                    <button class="w-full p-2.5 bg-purple-600 text-white font-black rounded-lg action-btn text-sm" onclick="saveReminder()">💾 SAVE</button>
                    <button class="w-full text-green-500 text-sm" onclick="closeModal()">Cancel</button>
                </div>
            `);
        }
        
        function selectRemIcon(icon) { 
            document.getElementById('remIcon').value = icon; 
            document.querySelectorAll('#modalBox .grid button').forEach(btn => { 
                btn.classList.remove('bg-green-200'); 
                if(btn.querySelector(`.fa-${icon.split('-')[1]}`)) btn.classList.add('bg-green-200'); 
            }); 
        }
        
        function saveReminder() { 
            const title = document.getElementById('remTitle').value.trim(); 
            if(!title) return alert("Enter title"); 
            const description = document.getElementById('remDesc').value.trim(); 
            const dueDate = document.getElementById('remDate').value; 
            const reminderDays = parseInt(document.getElementById('remDays').value); 
            const icon = document.getElementById('remIcon').value; 
            if(!dueDate) return alert("Select due date"); 
            db.reminders.push({id:Date.now(),title,description,dueDate,reminderDays,icon,alertSent:false,overdueAlertSent:false}); 
            saveDB(); 
            closeModal(); 
            renderReminders(); 
        }
        
        function openEditReminderModal(id) { 
            const rem = db.reminders.find(r => r.id === id); 
            if(!rem) return; 
            openModal(`<h2 class="font-black text-center text-lg mb-3 text-green-800"><i class="fa-solid fa-pen"></i> Edit Reminder</h2>
                <div class="space-y-3">
                    <div><label class="text-[10px]">Title</label><input id="remTitle" class="w-full p-2 rounded-lg border border-green-200 text-sm" value="${rem.title}"></div>
                    <div><label class="text-[10px]">Description</label><textarea id="remDesc" class="w-full p-2 rounded-lg border border-green-200 text-sm" rows="2">${rem.description || ''}</textarea></div>
                    <div><label class="text-[10px]">Due Date</label><input id="remDate" type="date" class="w-full p-2 rounded-lg border border-green-200 text-sm" value="${rem.dueDate}"></div>
                    <div><label class="text-[10px]">Remind before</label>
                        <select id="remDays" class="w-full p-2 rounded-lg border border-green-200 text-sm">
                            <option value="1" ${rem.reminderDays===1?'selected':''}>1 day before</option>
                            <option value="3" ${rem.reminderDays===3?'selected':''}>3 days before</option>
                            <option value="7" ${rem.reminderDays===7?'selected':''}>7 days before</option>
                            <option value="14" ${rem.reminderDays===14?'selected':''}>14 days before</option>
                        </select>
                    </div>
                    <button class="w-full p-2.5 bg-purple-600 text-white font-black rounded-lg action-btn text-sm" onclick="updateReminder(${id})">💾 UPDATE</button>
                    <button class="w-full text-green-500 text-sm" onclick="closeModal()">Cancel</button>
                </div>
            `); 
        }
        
        function updateReminder(id) { 
            const rem = db.reminders.find(r => r.id === id); 
            if(rem) { 
                rem.title = document.getElementById('remTitle').value.trim(); 
                rem.description = document.getElementById('remDesc').value.trim(); 
                rem.dueDate = document.getElementById('remDate').value; 
                rem.reminderDays = parseInt(document.getElementById('remDays').value); 
                rem.alertSent = false; 
                rem.overdueAlertSent = false; 
                saveDB(); 
                closeModal(); 
                renderReminders(); 
            } 
        }
        
        function deleteReminder(id) { 
            if(confirm("Delete this reminder?")) { 
                db.reminders = db.reminders.filter(r => r.id !== id); 
                saveDB(); 
                renderReminders(); 
            } 
        }
        
        // ===================== MODAL FUNCTIONS =====================
        function openModal(h){ 
            document.getElementById('modalBox').innerHTML=h; 
            document.getElementById('modalOverlay').style.display='flex'; 
        }
        
        function closeModal(){ 
            document.getElementById('modalOverlay').style.display='none'; 
        }
        
        window.onload=()=>{ lockApp(); };
    </script>
</body>
  </html>
